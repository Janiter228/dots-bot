<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e222f"/>
      <stop offset="50%" stop-color="#11131b"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="blueDot" cx="50%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#8bf0ff"/>
      <stop offset="32%" stop-color="#35b4ff"/>
      <stop offset="82%" stop-color="#1170ff"/>
      <stop offset="100%" stop-color="#48c4ff"/>
    </radialGradient>
    <radialGradient id="whiteDot" cx="42%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e5e9f2"/>
      <stop offset="100%" stop-color="#a8b0c2"/>
    </radialGradient>
    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b1"/>
      <feColorMatrix in="b1" type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.52  0 0 0 0 1  0 0 0 1 0" result="blueGlow"/>
      <feMerge>
        <feMergeNode in="blueGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="barGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b1"/>
      <feColorMatrix in="b1" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.56  0 0 0 0 1  0 0 0 1.3 0" result="blueGlow"/>
      <feMerge>
        <feMergeNode in="blueGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <g stroke-linecap="round" fill="none" filter="url(#barGlow)">
    <path d="M16 16 H32 M16 16 V32 M32 32 H48 V48 H16" stroke="#8ff4ff" stroke-width="2.1"/>
  </g>
  <g filter="url(#dotGlow)">
    <circle cx="16" cy="16" r="4.8" fill="url(#blueDot)" stroke="#9cf5ff" stroke-width="0.7"/>
    <circle cx="16" cy="32" r="4.8" fill="url(#blueDot)" stroke="#9cf5ff" stroke-width="0.7"/>
    <circle cx="48" cy="32" r="4.8" fill="url(#blueDot)" stroke="#9cf5ff" stroke-width="0.7"/>
    <circle cx="32" cy="48" r="4.8" fill="url(#blueDot)" stroke="#9cf5ff" stroke-width="0.7"/>
    <circle cx="48" cy="48" r="4.8" fill="url(#blueDot)" stroke="#9cf5ff" stroke-width="0.7"/>
  </g>
  <g>
    <circle cx="32" cy="16" r="4.8" fill="url(#whiteDot)" stroke="#ffffff" stroke-width="0.5"/>
    <circle cx="48" cy="16" r="4.8" fill="url(#whiteDot)" stroke="#ffffff" stroke-width="0.5"/>
    <circle cx="32" cy="32" r="4.8" fill="url(#whiteDot)" stroke="#ffffff" stroke-width="0.5"/>
    <circle cx="16" cy="48" r="4.8" fill="url(#whiteDot)" stroke="#ffffff" stroke-width="0.5"/>
  </g>
